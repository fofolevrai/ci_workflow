name: reusable-ros

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the ros_bridge project root.
        required: false
        type: string
        default: ros_bridge
      ros-distro:
        description: ROS 2 distribution used by the bridge image.
        required: false
        type: string
        default: lyrical
      require-docker-rebuild:
        description: Rebuild Docker image as a required gate before tests (PR/merge to master).
        required: false
        type: boolean
        default: false
      push-image:
        description: Push the rebuilt image to GHCR as the latest cache for feature branches.
        required: false
        type: boolean
        default: false
    secrets:
      SUBMODULES_TOKEN:
        description: Token with read access to private submodules (defaults to GITHUB_TOKEN).
        required: false

permissions:
  contents: read
  packages: write

jobs:
  ros-colcon-test:
    name: ros-colcon-test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.project-path }}
    env:
      ROS_DISTRO: ${{ inputs.ros-distro }}
      CI_IMAGE: ros-bridge-ci:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Set lowercase GHCR image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/ros-bridge-ci" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild Docker image (required gate for PR/merge to master)
        if: ${{ inputs.require-docker-rebuild }}
        run: docker build --build-arg ROS_DISTRO=${ROS_DISTRO} -t "${CI_IMAGE}" -f Dockerfile .

      - name: Pull pre-built Docker image (feature branches)
        if: ${{ !inputs.require-docker-rebuild }}
        run: |
          docker pull "${REGISTRY_IMAGE}:latest"
          docker tag "${REGISTRY_IMAGE}:latest" "${CI_IMAGE}"

      - name: Run colcon build and test inside container
        run: |
          set +e
          docker run --name ros_ci_runner "${CI_IMAGE}" bash -lc '
            # nounset stays off: ROS setup.bash reads unset vars (AMENT_TRACE_SETUP_FILES)
            set -eo pipefail
            source /opt/ros/$ROS_DISTRO/setup.bash
            cd /workspace/ros2_bridge
            colcon build --symlink-install --event-handlers console_direct+
            colcon test --event-handlers console_direct+ --return-code-on-test-failure
            colcon test-result --verbose
          '
          exit_code=$?

          mkdir -p ros_ci_artifacts
          docker cp ros_ci_runner:/workspace/ros2_bridge/log ros_ci_artifacts/log || true
          docker cp ros_ci_runner:/workspace/ros2_bridge/build ros_ci_artifacts/build || true
          docker cp ros_ci_runner:/workspace/ros2_bridge/install ros_ci_artifacts/install || true
          docker rm -f ros_ci_runner >/dev/null 2>&1 || true

          exit $exit_code

      - name: Push Docker image to GHCR (post-merge to master)
        if: ${{ success() && inputs.push-image }}
        run: |
          docker tag "${CI_IMAGE}" "${REGISTRY_IMAGE}:latest"
          docker push "${REGISTRY_IMAGE}:latest"

      - name: Upload ROS test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros-test-logs-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ inputs.project-path }}/ros_ci_artifacts/log

      - name: Upload ROS build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ros-build-tree-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ inputs.project-path }}/ros_ci_artifacts/build
            ${{ inputs.project-path }}/ros_ci_artifacts/install
