name: reusable-firmware

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the firmware project root.
        required: false
        type: string
        default: color_sensing_poc
      dockerfile-path:
        description: Path to the Dockerfile used to build the firmware CI image.
        required: false
        type: string
        default: Dockerfile
      image-name:
        description: Image suffix used for local and GHCR firmware CI images.
        required: false
        type: string
        default: firmware-ci
      require-docker-rebuild:
        description: Whether to require a Docker rebuild.
        required: false
        type: boolean
        default: false
      push-image:
        description: Whether to push the Docker image.
        required: false
        type: boolean
        default: false
      python-requirements:
        description: Code generator requirements file relative to project-path; skipped when absent.
        required: false
        type: string
        default: third_party/msg_protocol/requirements.txt
    secrets:
      SUBMODULES_TOKEN:
        description: Token with read access to private submodules (defaults to GITHUB_TOKEN).
        required: false

permissions:
  contents: read
  packages: write

jobs:
  firmware-build:
    name: firmware-build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.project-path }}
    env:
      CI_IMAGE: ${{ inputs.image-name }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      
      - name: Set lowercase GHCR image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image-name }}" >> "$GITHUB_ENV"
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild Docker image (required gate for PR/merge to master)
        if: ${{ inputs.require-docker-rebuild }}
        run: docker build -t "${CI_IMAGE}" -f "${{ inputs.dockerfile-path }}" .

      - name: Pull pre-built Docker image (feature branches)
        if: ${{ !inputs.require-docker-rebuild }}
        run: |
          if docker pull "${REGISTRY_IMAGE}:latest"; then
            docker tag "${REGISTRY_IMAGE}:latest" "${CI_IMAGE}"
          else
            echo "No latest image found; rebuilding from Dockerfile."
            docker build -t "${CI_IMAGE}" -f "${{ inputs.dockerfile-path }}" .
          fi
      
      - name: Install toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install code generator tools
        run: |
          if [[ -f "${{ inputs.python-requirements }}" ]]; then
            python -m pip install -r "${{ inputs.python-requirements }}"
          else
            echo "No ${{ inputs.python-requirements }}; skipping."
          fi

      - name: Configure Debug
        run: cmake --preset Debug -S build

      - name: Build Debug
        run: cmake --build build/build/Debug --parallel

      - name: Configure Release
        run: cmake --preset Release -S build

      - name: Build Release
        run: cmake --build build/build/Release --parallel

      - name: Verify firmware artifacts
        run: |
          test -f build/build/Debug/color_sensing_poc.elf
          test -f build/build/Release/color_sensing_poc.elf

      - name: Push Docker image to GHCR (post-merge to master)
        if: ${{ success() && inputs.push-image }}
        run: |
          docker tag "${CI_IMAGE}" "${REGISTRY_IMAGE}:latest"
          docker push "${REGISTRY_IMAGE}:latest"

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ inputs.project-path }}/build/build/Debug/color_sensing_poc.elf
            ${{ inputs.project-path }}/build/build/Release/color_sensing_poc.elf

      - name: Upload build trees on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-tree-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ inputs.project-path }}/build/build/Debug
            ${{ inputs.project-path }}/build/build/Release
