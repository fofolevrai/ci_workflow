name: reusable-firmware

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the firmware project root.
        required: false
        type: string
        default: color_sensing_poc

permissions:
  contents: read

jobs:
  firmware-build:
    name: firmware-build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.project-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Configure Debug
        run: cmake --preset Debug -S build

      - name: Build Debug
        run: cmake --build build/build/Debug --parallel

      - name: Configure Release
        run: cmake --preset Release -S build

      - name: Build Release
        run: cmake --build build/build/Release --parallel

      - name: Verify firmware artifacts
        run: |
          test -f build/build/Debug/color_sensing_poc.elf
          test -f build/build/Release/color_sensing_poc.elf

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ inputs.project-path }}/build/build/Debug/color_sensing_poc.elf
            ${{ inputs.project-path }}/build/build/Release/color_sensing_poc.elf

      - name: Upload build trees on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-tree-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ inputs.project-path }}/build/build/Debug
            ${{ inputs.project-path }}/build/build/Release
